<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiddom Illustration Library</title>
    <link rel="icon" type="image/png" href="assets/icons/favicon.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/styles.css?v=live1" />
  </head>
  <body>
    <div id="site-gate" class="site-gate" role="dialog" aria-modal="true" aria-labelledby="site-gate-title">
      <form id="site-gate-form" class="site-gate__form">
        <h1 id="site-gate-title" class="site-gate__title">Kiddom</h1>
        <label class="site-gate__field">
          <span class="visually-hidden">Password</span>
          <input
            id="site-gate-password"
            class="site-gate__input"
            type="password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
        </label>
        <p id="site-gate-error" class="site-gate__error" hidden>Incorrect password</p>
        <button type="submit" class="site-gate__submit">Enter</button>
      </form>
    </div>

    <header class="site-header">
      <h1 class="site-title">Kiddom</h1>
      <div class="header-search">
        <div class="header-search__field">
          <label class="visually-hidden" for="search-input">Search illustrations</label>
          <input
            id="search-input"
            type="search"
            placeholder="Search"
            autocomplete="off"
          />
          <button
            type="button"
            id="search-clear"
            class="header-search__clear"
            aria-label="Clear search"
            hidden
          >
            ×
          </button>
        </div>
      </div>
    </header>

    <main class="site-main">
      <section
        id="view-icon"
        class="view view--icon is-visible"
        aria-label="Icon grid"
      >
        <div id="icon-grid" class="icon-grid"></div>
      </section>
    </main>

    <aside
      id="detail-panel"
      class="detail-panel"
      aria-hidden="true"
      aria-labelledby="detail-title"
    >
      <div class="detail-panel__header">
        <div class="detail-panel__heading">
          <h2 id="detail-title" class="detail-panel__title"></h2>
        </div>
        <button
          type="button"
          class="detail-panel__close"
          id="detail-close"
          aria-label="Close details"
        >
          <span aria-hidden="true">×</span>
        </button>
      </div>

      <div class="detail-panel__body">
        <div id="detail-preview" class="detail-panel__preview" aria-hidden="true">
          <span class="placeholder placeholder--large"></span>
        </div>
        <p id="detail-credit" class="detail-panel__credit" hidden></p>
        <p id="detail-description" class="detail-panel__description"></p>
        <div class="detail-panel__actions">
          <div class="detail-panel__action-row">
            <button type="button" class="detail-panel__text-link" id="detail-upload">
              Upload
            </button>
            <span class="detail-panel__action-sep" aria-hidden="true">/</span>
            <span class="detail-panel__download-label">Download</span>
          </div>
          <div class="detail-panel__download-options">
            <button type="button" id="detail-download-png" class="detail-panel__text-link">
              RGB (.png)
            </button>
            <button type="button" id="detail-download-ai" class="detail-panel__text-link">
              CMYK (.ai)
            </button>
          </div>
        </div>
      </div>
    </aside>

    <input
      id="detail-file-input"
      class="visually-hidden"
      type="file"
      accept="image/*,.svg,image/svg+xml,.ai,application/postscript"
      tabindex="-1"
    />

    <button
      type="button"
      class="fab"
      id="add-btn"
      aria-label="Add illustration"
      title="Add illustration"
    >
      <span class="fab__plus" aria-hidden="true">+</span>
    </button>

    <dialog id="add-dialog" class="add-dialog">
      <form method="dialog" id="add-form" class="add-dialog__form">
        <h2>Add illustration</h2>
        <label>
          Name
          <input
            id="add-name"
            name="name"
            type="text"
            required
            placeholder="e.g. Apple"
          />
        </label>
        <label>
          Upload artwork
          <input
            id="add-file"
            name="file"
            type="file"
            accept="image/*,.svg,image/svg+xml"
          />
        </label>
        <p class="add-dialog__hint">
          Uploads stay on this device. You can download them later as PNG.
        </p>
        <div class="add-dialog__actions">
          <button type="button" id="add-cancel" class="btn btn--ghost">
            Cancel
          </button>
          <button type="submit" value="confirm" class="btn btn--solid">
            Add
          </button>
        </div>
      </form>
    </dialog>

    <script src="js/gate.js?v=live1"></script>
    <script src="js/data.js?v=sang1"></script>
    <script src="js/app.js?v=mush1"></script>
  </body>
</html>
